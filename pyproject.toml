[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-clm"
version = "0.1.0"
description = "Editable context for the native GitHub Copilot CLI via its BYOK interface"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
readme = "README.md"

[project.urls]
Homepage = "https://github.com/DelicateNorman/copilot-clm"
Issues = "https://github.com/DelicateNorman/copilot-clm/issues"

[project.scripts]
copilot-clm = "copilot_clm.cli:main"

[tool.setuptools.packages.find]
include = ["copilot_clm*"]
